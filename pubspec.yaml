version: 1.0.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0
  shared_preferences: ^2.2.0
dev_dependencies:
  flutter_launcher_icons: ^0.14.1
flutter_launcher_icons:
